name: astrea-sda-api-dev-hot

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Exposed for Local Host Process)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: astrea-dev-hot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrea
      POSTGRES_PASSWORD: astreadbpass
      POSTGRES_DB: astrea_sda
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_hot_data:/var/lib/postgresql/data
    networks:
      - astrea-dev-hot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrea -d astrea_sda"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache (Exposed for Local Host Process)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: astrea-dev-hot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_hot_data:/data
    networks:
      - astrea-dev-hot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Caddy Gateway (100% OSS Reverse Proxy with Automatic Local HTTPS)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: astrea-dev-hot-caddy
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile.dev-hot:/etc/caddy/Caddyfile:ro
      - caddy_dev_hot_data:/data
      - caddy_dev_hot_config:/config
    networks:
      - astrea-dev-hot-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  astrea-dev-hot-net:
    driver: bridge
    name: astrea-dev-hot-net

volumes:
  postgres_dev_hot_data:
    name: astrea_postgres_dev_hot_data
  redis_dev_hot_data:
    name: astrea_redis_dev_hot_data
  caddy_dev_hot_data:
    name: astrea_caddy_dev_hot_data
  caddy_dev_hot_config:
    name: astrea_caddy_dev_hot_config


