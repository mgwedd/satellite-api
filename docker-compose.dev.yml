name: astrea-sda-api-dev

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Local Dev Container)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: astrea-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrea
      POSTGRES_PASSWORD: astreadbpass
      POSTGRES_DB: astrea_sda
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - astrea-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrea -d astrea_sda"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache (Local Dev Container)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: astrea-dev-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - astrea-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Astrea SDA API Dev Container with Hot Reloading (cargo-watch)
  # ============================================================================
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: astrea-dev-api
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      POSTGRES_URI: "postgres://astrea:astreadbpass@postgres:5432/astrea_sda"
      REDIS_URL: "redis://redis:6379"
      ENABLE_DISCOVERY_PIPELINE: "true"
      RUST_LOG: "debug,astrea_sda_api=debug"
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo
      - target_cache:/app/target
    networks:
      astrea-dev-net:
        aliases:
          - api
          - api-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # Tailscale OSS Gateway (Main Dev Ingress - Zero /etc/hosts, Automatic TLS)
  # ============================================================================
  tailscale:
    image: tailscale/tailscale:stable
    container_name: astrea-dev-tailscale
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-sda}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale_dev_data:/var/lib/tailscale
      - ./tailscale:/config:ro
    networks:
      - astrea-dev-net
    depends_on:
      - api-dev

  # ============================================================================
  # Nginx Gateway (DIY / Local Experimentation Proxy)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: astrea-dev-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.keys:/etc/nginx/certs:ro
    networks:
      - astrea-dev-net
    depends_on:
      - api-dev

networks:
  astrea-dev-net:
    driver: bridge
    name: astrea-dev-net

volumes:
  postgres_dev_data:
    name: astrea_postgres_dev_data
  redis_dev_data:
    name: astrea_redis_dev_data
  cargo_cache:
    name: astrea_cargo_cache
  target_cache:
    name: astrea_target_cache
  tailscale_dev_data:
    name: astrea_tailscale_dev_data

