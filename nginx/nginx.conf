events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream Astrea SDA API Cluster (Docker DNS resolution)
    upstream astrea_api {
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost astrealabs.local.com *.local.com astrea.internal;

        ssl_certificate     /etc/nginx/certs/dev-tls.crt;
        ssl_certificate_key /etc/nginx/certs/dev-tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Health Check endpoint
        location /nginx-health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # Subpath Prefix Proxy: https://astrealabs.local.com/sda/api/v1/...
        location /sda/api/ {
            proxy_pass http://astrea_api/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /sda/api;
            proxy_set_header Connection "";

            # Pass-through RFC 8705 mTLS Certificate Fingerprint Headers
            proxy_set_header X-Client-Cert-Fingerprint $http_x_client_cert_fingerprint;
            proxy_set_header X-Client-Cert-Hash $http_x_client_cert_hash;

            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }

        # Root Proxy: https://astrealabs.local.com/v1/... or http://localhost:8888/v1/...
        location / {
            proxy_pass http://astrea_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Pass-through RFC 8705 mTLS Certificate Fingerprint Headers
            proxy_set_header X-Client-Cert-Fingerprint $http_x_client_cert_fingerprint;
            proxy_set_header X-Client-Cert-Hash $http_x_client_cert_hash;

            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }
    }
}
