name: astrea-sda-api-dev

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Local Dev Container)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: astrea-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrea
      POSTGRES_PASSWORD: astreadbpass
      POSTGRES_DB: astrea_sda
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - astrea-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrea -d astrea_sda"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache (Local Dev Container)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: astrea-dev-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - astrea-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Astrea SDA API Dev Container with Hot Reloading (cargo-watch)
  # ============================================================================
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: astrea-dev-api
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      POSTGRES_URI: "postgres://astrea:astreadbpass@postgres:5432/astrea_sda"
      REDIS_URL: "redis://redis:6379"
      ENABLE_DISCOVERY_PIPELINE: "true"
      RUST_LOG: "debug,astrea_sda_api=debug"
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo
      - target_cache:/app/target
    networks:
      astrea-dev-net:
        aliases:
          - api
          - api-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # Caddy Gateway (100% OSS Reverse Proxy with Automatic Local HTTPS)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: astrea-dev-caddy
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dev_data:/data
      - caddy_dev_config:/config
    networks:
      - astrea-dev-net
    depends_on:
      - api-dev

networks:
  astrea-dev-net:
    driver: bridge
    name: astrea-dev-net

volumes:
  postgres_dev_data:
    name: astrea_postgres_dev_data
  redis_dev_data:
    name: astrea_redis_dev_data
  cargo_cache:
    name: astrea_cargo_cache
  target_cache:
    name: astrea_target_cache
  caddy_dev_data:
    name: astrea_caddy_dev_data
  caddy_dev_config:
    name: astrea_caddy_dev_config


