name: astrea-sda-api

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Generic DataProvider)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: astrea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrea
      POSTGRES_PASSWORD: astreadbpass
      POSTGRES_DB: astrea_sda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astrea-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrea -d astrea_sda"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis L2 Distributed Cache Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: astrea-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - astrea-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Astrea SDA API Production Application Container
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrea-api
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      POSTGRES_URI: "postgres://astrea:astreadbpass@postgres:5432/astrea_sda"
      REDIS_URL: "redis://redis:6379"
      ENABLE_DISCOVERY_PIPELINE: "true"
    volumes:
      - ./.keys:/app/.keys:ro
    networks:
      - astrea-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger-ui || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Caddy Gateway (100% OSS Reverse Proxy with Automatic Local HTTPS)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: astrea-caddy
    restart: unless-stopped
    profiles:
      - local
      - gateway
    ports:
      - "8888:8888"
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - astrea-net
    depends_on:
      - api

networks:
  astrea-net:
    driver: bridge
    name: astrea-net

volumes:
  postgres_data:
    name: astrea_postgres_data
  redis_data:
    name: astrea_redis_data
  caddy_data:
    name: astrea_caddy_data
  caddy_config:
    name: astrea_caddy_config


