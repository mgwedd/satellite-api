events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Upstream Astrea SDA API Cluster (Docker DNS resolution)
    upstream astrea_api {
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost astrea.internal;

        # Health Check endpoint
        location /nginx-health {
            default_type text/plain;
            return 200 "OK\n";
        }

        # Proxy all API requests to upstream Astrea SDA API container
        location / {
            proxy_pass http://astrea_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Pass-through RFC 8705 mTLS Certificate Fingerprint Headers if present
            proxy_set_header X-Client-Cert-Fingerprint $http_x_client_cert_fingerprint;
            proxy_set_header X-Client-Cert-Hash $http_x_client_cert_hash;

            # Buffer settings for high-throughput SDA telemetry ingest
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
        }
    }
}
