name: astrea-sda-api

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database (Generic DataProvider)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: astrea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrea
      POSTGRES_PASSWORD: astreadbpass
      POSTGRES_DB: astrea_sda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - astrea-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrea -d astrea_sda"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis L2 Distributed Cache Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: astrea-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - astrea-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Astrea SDA API Production Application Container
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrea-api
    restart: unless-stopped
    ports:
      - "8880:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      POSTGRES_URI: "postgres://astrea:astreadbpass@postgres:5432/astrea_sda"
      REDIS_URL: "redis://redis:6379"
      ENABLE_DISCOVERY_PIPELINE: "true"
    volumes:
      - ./.keys:/app/.keys:ro
    networks:
      - astrea-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/swagger-ui || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Tailscale OSS Gateway (Zero /etc/hosts, Automatic TLS)
  # ============================================================================
  tailscale:
    image: tailscale/tailscale:stable
    container_name: astrea-tailscale
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-sda}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve-prod.json
      - TS_USERSPACE=true
    volumes:
      - tailscale_data:/var/lib/tailscale
      - ./tailscale:/config:ro
    networks:
      - astrea-net
    depends_on:
      - api

  # ============================================================================
  # Nginx High-Performance Reverse Proxy & Gateway (DIY / Local Fallback)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: astrea-nginx
    restart: unless-stopped
    ports:
      - "8888:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.keys:/etc/nginx/certs:ro
    networks:
      - astrea-net
    depends_on:
      - api

networks:
  astrea-net:
    driver: bridge
    name: astrea-net

volumes:
  postgres_data:
    name: astrea_postgres_data
  redis_data:
    name: astrea_redis_data
  tailscale_data:
    name: astrea_tailscale_data

