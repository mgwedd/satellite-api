name: CI & SDK Release Pipeline

on:
  push:
    branches: [ main, read-celestrak-columns, "feat/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets --all-features

      - name: Build Release Binary
        run: cargo build --release

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: astrea-sda-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  openapi-breaking-change-check:
    name: OpenAPI Breaking Change Gate (pb33f/openapi-changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Head Branch
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'

      - name: Install pb33f/openapi-changes CLI
        run: go install github.com/pb33f/openapi-changes@latest

      - name: Detect OpenAPI Contract Breaking Changes
        run: |
          echo "Comparing base OpenAPI spec against head OpenAPI spec..."
          if [ -f base/api-docs/openapi.json ] && [ -f head/api-docs/openapi.json ]; then
            $(go env GOPATH)/bin/openapi-changes summary --markdown base/api-docs/openapi.json head/api-docs/openapi.json
          else
            echo "Notice: Base or Head OpenAPI spec file missing (initial setup or non-PR event). Skipping diff."
          fi

  fern-sdk-build-and-release:
    name: Fern SDK Generation & Release Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Run Fern Spec Check
        run: fern check --warnings

      - name: Generate SDKs with Fern (Open-Source Local CLI)
        run: fern generate --local

      - name: Package SDK Archives
        run: |
          mkdir -p dist
          tar -czvf dist/astrea-sda-api-sdk-typescript.tar.gz -C sdks/typescript .
          tar -czvf dist/astrea-sda-api-sdk-python.tar.gz -C sdks/python .
          tar -czvf dist/astrea-sda-api-sdk-go.tar.gz -C sdks/go .
          tar -czvf dist/astrea-sda-api-sdk-java.tar.gz -C sdks/java .
          tar -czvf dist/astrea-sda-api-sdk-rust.tar.gz -C sdks/rust .

      - name: Release SDK Archives to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/astrea-sda-api-sdk-typescript.tar.gz
            dist/astrea-sda-api-sdk-python.tar.gz
            dist/astrea-sda-api-sdk-go.tar.gz
            dist/astrea-sda-api-sdk-java.tar.gz
            dist/astrea-sda-api-sdk-rust.tar.gz
          generate_release_notes: true

  deploy-railway:
    name: Deploy to Railway (Production)
    runs-on: ubuntu-latest
    needs:
      - test-and-build
      - docker-build-check
      - openapi-breaking-change-check
      - fern-sdk-build-and-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Railway Secret Token
        id: check-token
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::notice::RAILWAY_TOKEN secret is not configured in repository secrets. Skipping deployment."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Railway CLI
        if: steps.check-token.outputs.has_token == 'true'
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: steps.check-token.outputs.has_token == 'true'
        run: railway up --service astrea-sda-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}


